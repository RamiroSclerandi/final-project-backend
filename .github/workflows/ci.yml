name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests, lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-worker
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest -q

  integration:
    name: Integration tests (Postgres + PostgREST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-worker
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pull Supabase Postgres image
        run: |
          for attempt in 1 2 3 4; do
            docker pull public.ecr.aws/supabase/postgres:17.6.1.167 && exit 0
            echo "pull attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Integration tests
        run: uv run pytest -m integration -q

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check set-sampling-interval/index.ts

      # Throwaway anonymous broker for broker.test.ts; the config is inlined
      # because service containers start before checkout and cannot mount it.
      - name: Start test MQTT broker
        run: |
          docker run -d --name mosquitto -p 9001:9001 eclipse-mosquitto:2 \
            sh -c 'printf "listener 9001\nprotocol websockets\nallow_anonymous true\n" > /tmp/m.conf && exec mosquitto -c /tmp/m.conf'
          for attempt in $(seq 1 30); do
            docker logs mosquitto 2>&1 | grep -q "version .* running" && exit 0
            sleep 1
          done
          docker logs mosquitto
          exit 1

      - name: Unit and broker tests
        env:
          MQTT_TEST_BROKER_URL: ws://127.0.0.1:9001
        run: deno test --allow-env --allow-net set-sampling-interval/
