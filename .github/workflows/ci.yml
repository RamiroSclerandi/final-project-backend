name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests, lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-worker
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest -q

  integration:
    name: Integration tests (Postgres + PostgREST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-worker
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pull Supabase Postgres image
        run: |
          for attempt in 1 2 3 4; do
            docker pull public.ecr.aws/supabase/postgres:17.6.1.167 && exit 0
            echo "pull attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Integration tests
        run: uv run pytest -m integration -q

  realtime:
    name: Realtime delivery (local Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # Only the services the test touches: Postgres, Auth, PostgREST, Realtime and Kong.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,mailpit,supavisor,postgres-meta,storage-api,edge-runtime

      # These are the CLI's fixed local-development keys, not project secrets.
      - name: Export local keys
        run: |
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=')"
          # Missing keys would make the test skip and the job pass silently.
          : "${ANON_KEY:?supabase status printed no ANON_KEY}" "${SERVICE_ROLE_KEY:?supabase status printed no SERVICE_ROLE_KEY}"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Realtime delivery test
        working-directory: supabase
        run: |
          deno fmt --check tests/
          deno lint tests/
          deno test --allow-env --allow-net tests/

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check set-sampling-interval/index.ts

      # Throwaway anonymous broker for broker.test.ts; the config is inlined
      # because service containers start before checkout and cannot mount it.
      - name: Start test MQTT broker
        run: |
          docker run -d --name mosquitto -p 9001:9001 eclipse-mosquitto:2 \
            sh -c 'printf "listener 9001\nprotocol websockets\nallow_anonymous true\n" > /tmp/m.conf && exec mosquitto -c /tmp/m.conf'
          for attempt in $(seq 1 30); do
            docker logs mosquitto 2>&1 | grep -q "version .* running" && exit 0
            sleep 1
          done
          docker logs mosquitto
          exit 1

      - name: Unit and broker tests
        env:
          MQTT_TEST_BROKER_URL: ws://127.0.0.1:9001
        run: deno test --allow-env --allow-net set-sampling-interval/
